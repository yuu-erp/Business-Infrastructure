version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: xox-postgres
    restart: always
    environment:
      POSTGRES_USER: xox_admin
      POSTGRES_PASSWORD: xox_password
      POSTGRES_DB: xox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: xox-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
